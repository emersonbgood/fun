<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drop Shadow Tic-Tac-Toe (AI & Fading)</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Top Left AI Control Panel */
        #ai-control {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #252525;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #007bff;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        #info {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        #sub-info {
            font-size: 14px;
            margin-bottom: 20px;
            color: #aaa;
        }
        canvas {
            background-color: #252525;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #reset-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        #reset-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div id="ai-control">
        <span>Oai</span>
        <label class="switch">
            <input type="checkbox" id="aiToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div id="info">Player X's Turn</div>
    <div id="sub-info">Max 3 pieces per player. Watch the pulsing piece—it's next to leave!</div>
    <canvas id="gameCanvas" width="450" height="450"></canvas>
    <button id="reset-btn">Restart Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const size = 450;
        const cellSize = size / 3;

        let board = Array(9).fill(null);
        let turn = "X";
        let history = { "X": [], "O": [] };
        let gameOver = false;
        let pulseAlpha = 1.0;
        let pulseDirection = -1;

        const wins = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        function checkWin(p, currentBoard = board) {
            return wins.some(combo => combo.every(idx => currentBoard[idx] === p));
        }

        // Basic Smart AI Evaluation
        function getBestMove() {
            // 1. Can AI Win right now?
            for(let i=0; i<9; i++) {
                if(board[i] === null) {
                    let nextBoard = [...board];
                    let nextHistory = [...history["O"]];
                    nextBoard[i] = "O";
                    nextHistory.push(i);
                    if(nextHistory.length > 3) nextBoard[nextHistory.shift()] = null;
                    if(checkWin("O", nextBoard)) return i;
                }
            }
            // 2. Can AI block Player X from winning next turn?
            for(let i=0; i<9; i++) {
                if(board[i] === null) {
                    let nextBoard = [...board];
                    let nextHistory = [...history["X"]];
                    nextBoard[i] = "X";
                    nextHistory.push(i);
                    if(nextHistory.length > 3) nextBoard[nextHistory.shift()] = null;
                    if(checkWin("X", nextBoard)) return i;
                }
            }
            // 3. Fallback to preferential positions (Center, Corners, Sides)
            const preferred = [4, 0, 2, 6, 8, 1, 3, 5, 7];
            for(let pos of preferred) {
                if(board[pos] === null) return pos;
            }
            return board.indexOf(null);
        }

        function triggerAiMove() {
            if (gameOver || turn !== "O") return;
            
            setTimeout(() => {
                const bestIdx = getBestMove();
                if(bestIdx !== -1) {
                    executeMove(bestIdx);
                }
            }, 400); // Slight delay makes it feel natural
        }

        function executeMove(index) {
            board[index] = turn;
            history[turn].push(index);

            if (history[turn].length > 3) {
                const oldestIndex = history[turn].shift();
                board[oldestIndex] = null;
            }

            if (checkWin(turn)) {
                document.getElementById('info').innerText = `Player ${turn} Wins! 🎉`;
                gameOver = true;
                return;
            }

            turn = (turn === "X") ? "O" : "X";
            document.getElementById('info').innerText = `Player ${turn}'s Turn`;

            if(document.getElementById('aiToggle').checked && turn === "O") {
                triggerAiMove();
            }
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver) return;
            if (turn === "O" && document.getElementById('aiToggle').checked) return; // Block input on AI turn

            const rect = canvas.getBoundingClientRect();
            const col = Math.floor((e.clientX - rect.left) / cellSize);
            const row = Math.floor((e.clientY - rect.top) / cellSize);
            const index = row * 3 + col;

            if (board[index] === null) {
                executeMove(index);
            }
        });

        function renderLoop() {
            // Update the pulsing alpha value for the oldest piece
            pulseAlpha += pulseDirection * 0.025;
            if (pulseAlpha <= 0.2) { pulseAlpha = 0.2; pulseDirection = 1; }
            if (pulseAlpha >= 1.0) { pulseAlpha = 1.0; pulseDirection = -1; }

            ctx.clearRect(0, 0, size, size);

            // Grid Lines
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            for (let i = 1; i < 3; i++) {
                ctx.beginPath(); ctx.moveTo(i * cellSize, 20); ctx.lineTo(i * cellSize, size - 20); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(20, i * cellSize); ctx.lineTo(size - 20, i * cellSize); ctx.stroke();
            }

            // Typography Config
            ctx.font = "bold 90px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // Find current oldest pieces
            const oldestX = history["X"].length === 3 ? history["X"][0] : null;
            const oldestO = history["O"].length === 3 ? history["O"][0] : null;

            for (let i = 0; i < 9; i++) {
                if (!board[i]) continue;

                const x = (i % 3) * cellSize + cellSize / 2;
                const y = Math.floor(i / 3) * cellSize + cellSize / 2;
                const p = board[i];

                const isOldest = (p === "X" && i === oldestX) || (p === "O" && i === oldestO);
                
                ctx.save();
                if (isOldest && !gameOver) {
                    ctx.globalAlpha = pulseAlpha; // Apply fading animation
                }

                const mainColor = (p === "X") ? "#ff4d4d" : "#3399ff";
                const shadowColor = (p === "X") ? "#660000" : "#003366";

                // Shadow Copy
                ctx.fillStyle = shadowColor;
                ctx.fillText(p, x + 5, y + 6);

                // Main Copy
                ctx.fillStyle = mainColor;
                ctx.fillText(p, x, y);
                
                ctx.restore();
            }

            requestAnimationFrame(renderLoop);
        }

        function resetGame() {
            board = Array(9).fill(null);
            history = { "X": [], "O": [] };
            turn = "X";
            gameOver = false;
            document.getElementById('info').innerText = "Player X's Turn";
        }

        document.getElementById('reset-btn').addEventListener('click', resetGame);
        document.getElementById('aiToggle').addEventListener('change', () => {
            resetGame();
            if(document.getElementById('aiToggle').checked && turn === "O") triggerAiMove();
        });

        // Run Engine
        renderLoop();
    </script>
</body>
</html>
