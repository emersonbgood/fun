<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drop Shadow Tic-Tac-Toe</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #info {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        #sub-info {
            font-size: 14px;
            margin-bottom: 20px;
            color: #aaa;
        }
        canvas {
            background-color: #252525;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #reset-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        #reset-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div id="info">Player X's Turn</div>
    <div id="sub-info">Max 3 pieces per player. Placing a 4th moves your oldest piece!</div>
    <canvas id="gameCanvas" width="450" height="450"></canvas>
    <button id="reset-btn">Restart Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const size = 450;
        const cellSize = size / 3;

        // Game state variables
        let board = Array(9).fill(null);
        let turn = "X";
        let history = { "X": [], "O": [] };
        let gameOver = false;

        function drawBoard() {
            ctx.clearRect(0, 0, size, size);

            // Draw grid lines
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";

            for (let i = 1; i < 3; i++) {
                // Vertical lines
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 20);
                ctx.lineTo(i * cellSize, size - 20);
                ctx.stroke();

                // Horizontal lines
                ctx.beginPath();
                ctx.moveTo(20, i * cellSize);
                ctx.lineTo(size - 20, i * cellSize);
                ctx.stroke();
            }

            // Draw pieces with 3D drop shadow text effect
            ctx.font = "bold 90px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let i = 0; i < 9; i++) {
                if (!board[i]) continue;

                const x = (i % 3) * cellSize + cellSize / 2;
                const y = Math.floor(i / 3) * cellSize + cellSize / 2;
                const p = board[i];

                // Set up distinctive colors for X and O
                const mainColor = (p === "X") ? "#ff4d4d" : "#3399ff";
                const shadowColor = (p === "X") ? "#660000" : "#003366";

                // Layer 1: The bottom shadow (shifted down and right)
                ctx.fillStyle = shadowColor;
                ctx.fillText(p, x + 5, y + 6);

                // Layer 2: The top main element
                ctx.fillStyle = mainColor;
                ctx.fillText(p, x, y);
            }
        }

        function checkWin(p) {
            const wins = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
                [0, 4, 8], [2, 4, 6]             // Diagonals
            ];
            return wins.some(combo => combo.every(idx => board[idx] === p));
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const col = Math.floor(clickX / cellSize);
            const row = Math.floor(clickY / cellSize);
            const index = row * 3 + col;

            if (board[index] === null) {
                // Register piece placement
                board[index] = turn;
                history[turn].push(index);

                // Apply 3-piece limit rule
                if (history[turn].length > 3) {
                    const oldestIndex = history[turn].shift();
                    board[oldestIndex] = null;
                }

                drawBoard();

                if (checkWin(turn)) {
                    document.getElementById('info').innerText = `Player ${turn} Wins! 🎉`;
                    gameOver = true;
                    return;
                }

                // Swap turns
                turn = (turn === "X") ? "O" : "X";
                document.getElementById('info').innerText = `Player ${turn}'s Turn`;
            }
        });

        function resetGame() {
            board = Array(9).fill(null);
            history = { "X": [], "O": [] };
            turn = "X";
            gameOver = false;
            document.getElementById('info').innerText = "Player X's Turn";
            drawBoard();
        }

        document.getElementById('reset-btn').addEventListener('click', resetGame);

        // Initial paint run
        drawBoard();
    </script>
</body>
</html>
