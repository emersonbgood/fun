<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Magnetic Hole</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; z-index: 10; text-shadow: 2px 2px 4px #000; }
        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 24px; cursor: pointer; z-index: 100; border: none; border-radius: 50px; background: #4cd137; color: white; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
    <!-- Load Libraries Directly -->
    <script src="./3D Magnetic Hole_files/three.min.js"></script>
    <script src="./3D Magnetic Hole_files/cannon.min.js"></script>

</head>
<body>
    <button id="start-btn" style="display: none;">START GAME</button>
    <div id="ui">
        <h1>Score: <span id="score">135936</span></h1>
        <p>Attraction: <span id="attract-speed">13613.6</span></p>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const scoreEl = document.getElementById('score');
        const attractEl = document.getElementById('attract-speed');
        
        startBtn.onclick = () => {
            if (typeof THREE === 'undefined' || typeof CANNON === 'undefined') {
                alert("Libraries haven't loaded yet. Check your internet connection.");
                return;
            }
            startBtn.style.display = 'none';
            initGame();
        };

        function initGame() {
            const world = new CANNON.World();
            world.gravity.set(0, -25, 0);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2f3640);
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(10, 30, 10);
            sun.castShadow = true;
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(300, 300),
                new THREE.MeshPhongMaterial({ color: 0x353b48 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            let currentHoleRadius = 2.0;
            const holeVis = new THREE.Mesh(
                new THREE.RingGeometry(0, currentHoleRadius, 48),
                new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
            );
            holeVis.rotation.x = -Math.PI / 2;
            holeVis.position.y = 0.05;
            scene.add(holeVis);

            const objects = [];
            function spawnCube() {
                const w = 0.5 + Math.random() * 3.5;
                const h = 0.5 + Math.random() * 3.5;
                const d = 0.5 + Math.random() * 3.5;
                const maxSize = Math.max(w, h, d);

                const body = new CANNON.Body({ 
                    mass: 1, 
                    shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)),
                    linearDamping: 0.1 
                });
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 50;
                body.position.set(Math.cos(angle) * dist, h/2 + 2, Math.sin(angle) * dist);
                world.addBody(body);

                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(w, h, d),
                    new THREE.MeshPhongMaterial({ color: `hsl(${Math.random()*360}, 70%, 50%)` })
                );
                mesh.castShadow = true;
                scene.add(mesh);
                objects.push({ body, mesh, size: maxSize });
            }

            for(let i=0; i<50; i++) spawnCube();

            const keys = {};
            window.onkeydown = (e) => keys[e.code] = true;
            window.onkeyup = (e) => keys[e.code] = false;

            let score = 0;

            function animate() {
                requestAnimationFrame(animate);
                world.step(1/60);

                const speed = 0.3;
                if(keys['ArrowUp'] || keys['KeyW']) holeVis.position.z -= speed;
                if(keys['ArrowDown'] || keys['KeyS']) holeVis.position.z += speed;
                if(keys['ArrowLeft'] || keys['KeyA']) holeVis.position.x -= speed;
                if(keys['ArrowRight'] || keys['KeyD']) holeVis.position.x += speed;

                camera.position.set(holeVis.position.x, 25, holeVis.position.z + 20);
                camera.lookAt(holeVis.position.x, 0, holeVis.position.z);

                const pullStrength = 0.02 + (score * 0.0001); 
                attractEl.innerText = (pullStrength * 1000).toFixed(1);

                for (let i = objects.length - 1; i >= 0; i--) {
                    const obj = objects[i];
                    const dirX = holeVis.position.x - obj.body.position.x;
                    const dirZ = holeVis.position.z - obj.body.position.z;
                    const distance = Math.sqrt(dirX * dirX + dirZ * dirZ);

                    if (distance > currentHoleRadius * 0.4) {
                        obj.body.velocity.x += (dirX / distance) * pullStrength;
                        obj.body.velocity.z += (dirZ / distance) * pullStrength;
                    }

                    if (distance < currentHoleRadius) {
                        if (obj.size < currentHoleRadius * 1.3) {
                            obj.body.collisionFilterMask = 0; 
                        }
                        if (obj.body.position.y < -5) {
                            scene.remove(obj.mesh);
                            world.removeBody(obj.body);
                            objects.splice(i, 1);
                            score += Math.ceil(obj.size * 10);
                            scoreEl.innerText = score;
                            currentHoleRadius += 0.05 * obj.size;
                            holeVis.scale.set(currentHoleRadius/2.0, currentHoleRadius/2.0, 1);
                            spawnCube();
                        }
                    }
                    obj.mesh.position.copy(obj.body.position);
                    obj.mesh.quaternion.copy(obj.body.quaternion);
                }
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
