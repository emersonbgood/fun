<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" width="100%" height="100%">
  <!-- Style block for easy color duplication -->
  <style>
    .card-border { fill: #111111; }
    .card-bg { fill: #fbc02d; }
    .card-oval { fill: #f57f17; stroke: #ffffff; stroke-width: 7; }
    .card-text-base { font-family: "Arial Black", Gadget, sans-serif; font-weight: 900; }
    .text-stroke { fill: #000000; }
    .text-face { fill: #ffffff; }
    .icon-graphic { fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; }
  </style>

  <defs>
    <!-- Card Clip Path -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="300" height="440" rx="28" ry="28" />
    </clipPath>

    <!-- Reusable 0 Graphic with Outer Stroke -->
    <g id="numberZero">
      <!-- Outer thick stroke overlay -->
      <text x="0" y="0" class="card-text-base text-stroke" font-size="160" text-anchor="middle" dominant-baseline="central" stroke="#000000" stroke-width="16" stroke-linejoin="miter">0</text>
      <!-- Inner white face -->
      <text x="0" y="0" class="card-text-base text-face" font-size="160" text-anchor="middle" dominant-baseline="central">0</text>
    </g>

    <!-- Reusable Corner 0 Graphic -->
    <g id="cornerZero">
      <text x="0" y="0" class="card-text-base text-stroke" font-size="52" text-anchor="middle" dominant-baseline="central" stroke="#000000" stroke-width="8" stroke-linejoin="miter">0</text>
      <text x="0" y="0" class="card-text-base text-face" font-size="52" text-anchor="middle" dominant-baseline="central">0</text>
    </g>

    <!-- Reusable Pass/No Mercy Cycle Icon -->
    <g id="cycleIcon">
      <!-- Outer black silhouette backing for legibility -->
      <path d="M -8,-2 A 9,9 0 1,1 -2,7 M 8,2 A 9,9 0 1,1 2,-7" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
      <path d="M -5,10 L -9,6 L -5,2 M 5,-10 L 9,-6 L 5,-2" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="miter" stroke-linejoin="miter"/>
      
      <!-- Crisp white foreground icon lines -->
      <path d="M -8,-2 A 9,9 0 1,1 -2,7 M 8,2 A 9,9 0 1,1 2,-7" class="icon-graphic"/>
      <path d="M -5,10 L -9,6 L -5,2 M 5,-10 L 9,-6 L 5,-2" class="icon-graphic" stroke-linejoin="miter"/>
    </g>
  </defs>

  <!-- Card Body -->
  <g clip-path="url(#cardClip)">
    <!-- Outer Border -->
    <rect width="300" height="440" class="card-border" />
    
    <!-- Inner Background Template Layer -->
    <rect x="14" y="14" width="272" height="412" rx="16" ry="16" class="card-bg" />

    <!-- Center Oval Shape matching the image profile -->
    <ellipse cx="150" cy="220" rx="155" ry="72" class="card-oval" transform="rotate(-53, 150, 220)" />

    <!-- Center Large Number Graphic -->
    <use href="#numberZero" x="150" y="216" />

    <!-- Top-Left Corner Graphics -->
    <g transform="translate(42, 52)">
      <use href="#cornerZero" />
      <use href="#cycleIcon" transform="translate(0, 42) scale(0.9)" />
    </g>

    <!-- Bottom-Right Corner Graphics -->
    <g transform="translate(258, 388) rotate(180)">
      <use href="#cornerZero" />
      <use href="#cycleIcon" transform="translate(0, 42) scale(0.9)" />
    </g>
  </g>
</svg>
